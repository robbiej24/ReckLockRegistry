{% extends "base.html" %}
{% block content %}
<h1>Sign in</h1>
<p class="lede">Paste an API key issued for this registry. The key is stored in an HTTP-only cookie for browser use.</p>
{% if error %}
<p class="banner err">{{ error }}</p>
{% endif %}
<form method="post" action="/ui/sign-in" class="stack-form">
  <label for="token">API key</label>
  <input id="token" name="token" type="password" autocomplete="off" required />
  <button type="submit">Continue</button>
</form>
<p class="muted">Alternatively send <code>Authorization: Bearer …</code> on each request (CLI & automation).</p>
{% endblock %}
