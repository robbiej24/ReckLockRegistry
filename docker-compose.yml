services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenttrust
      POSTGRES_PASSWORD: agenttrust
      POSTGRES_DB: agenttrust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrust -d agenttrust"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://agenttrust:agenttrust@postgres:5432/agenttrust
      AGENTTRUST_ENV: production
      AGENTTRUST_API_HOST: 0.0.0.0
      AGENTTRUST_API_PORT: "8080"
      # Ephemeral path writable by the container non-root user (mount a volume here for production registry files).
      RECKLOCK_REGISTRY_ROOT: /tmp/recklock-registry
      AGENTTRUST_ENABLE_REAL_CONNECTORS: "false"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
