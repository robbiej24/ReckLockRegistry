[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recklock-registry"
version = "0.1.0"
description = "Minimal AI agent identity registry using unsigned YAML manifests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "typer>=0.9",
  "pytest>=7.4",
  "PyNaCl>=1.5",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "jinja2>=3.1",
]

[project.scripts]
recklock-registry = "recklock.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["recklock"]

[tool.hatch.build.targets.wheel.force-include]
"db" = "db"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
